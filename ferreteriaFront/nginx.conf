# ============================================================================
# nginx.conf — Reverse proxy para ferreteria/frontend
# ----------------------------------------------------------------------------
# Sirve la SPA estática desde /usr/share/nginx/html y hace reverse-proxy de
# /api/* al backend Spring Boot dentro de la red Docker.
#
# Por qué nginx-proxy en vez de axios directo:
#   1. Mismo origen para el browser → cookies HttpOnly (at, rt) y CSRF
#      (XSRF-TOKEN) se manejan sin CORS ni SameSite=None.
#   2. Cache de estáticos hashed (vite pone hash en el filename).
#   3. Compresión gzip/brotli sin tocar el backend.
# ============================================================================

# Subrequest / file-upload
client_max_body_size 25m;

# Compresión
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

# Cache de estáticos largos (vite pone hash en el nombre → cache 1 año OK)
map $sent_http_content_type $is_static_asset {
    default                                 0;
    ~*^application/javascript$             1;
    ~*^text/css$                            1;
    ~*^image/svg\+xml$                      1;
    ~*^font/                                1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck rápido (sin pasar por el backend)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ─── API reverse proxy ─────────────────────────────────────────────
    # Todo lo que empieza con /api/ va al backend.
    location /api/ {
        proxy_pass http://ferreteria-backend:8080;
        proxy_http_version 1.1;

        # Host/identidad
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Cookies HttpOnly del backend deben llegar al browser sin reescritura
        proxy_pass_header Set-Cookie;
        # Importante: nginx NO debe transformar cookies; las del backend ya
        # tienen Domain correcto (vacio) y Path=/.
        proxy_cookie_path / /;

        # WebSocket / SSE (futuro)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Timeouts: las requests de login pueden ser lentas en arranque
        # (JIT, hibernate, etc.). El doble del timeout de axios (30s).
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # ─── Prometheus scrape interno ───────────────────────────────────────
    # El job de Prometheus está dentro de la red Docker, así que puede
    # apuntar directo a ferreteria-backend:8080. Pero si lo quieres exponer
    # al host para debug manual, descomenta la regla location /metrics.
    # location = /actuator/prometheus { proxy_pass http://ferreteria-backend:8080/actuator/prometheus; }

    # ─── Assets con hash (vite emite /assets/<hash>.<ext>) ──────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Otros estáticos (favicon, etc.) ─────────────────────────────────
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ─── SPA fallback: cualquier ruta no matched → index.html ──────────
    # Necesario para React Router (BrowserRouter). El backend no recibe
    # ninguna ruta que no sea /api/* — el resto lo sirve nginx.
    location / {
        # No cachear index.html: queremos que los deploys se vean sin
        # que el browser sirva HTML viejo.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        try_files $uri $uri/ /index.html;
    }

    # Security headers (defensa en profundidad — el backend ya valida CSRF,
    # XSS en JSON, etc. pero headers extra nunca sobran).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
}
