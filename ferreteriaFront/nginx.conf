# ============================================================================
# nginx.conf — Reverse proxy para ferreteria/frontend
# ----------------------------------------------------------------------------
# Sirve la SPA estática desde /usr/share/nginx/html y hace reverse-proxy de
# /api/* al backend Spring Boot dentro de la red Docker.
#
# Por qué nginx-proxy en vez de axios directo:
#   1. Mismo origen para el browser → cookies HttpOnly (at, rt) y CSRF
#      (XSRF-TOKEN) se manejan sin CORS ni SameSite=None.
#   2. Cache de estáticos hashed (vite pone hash en el filename).
#   3. Compresión gzip/brotli sin tocar el backend.
# ============================================================================

# Subrequest / file-upload
client_max_body_size 25m;

# Compresión
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

# Cache de estáticos largos (vite pone hash en el nombre → cache 1 año OK)
map $sent_http_content_type $is_static_asset {
    default                                 0;
    ~*^application/javascript$             1;
    ~*^text/css$                            1;
    ~*^image/svg\+xml$                      1;
    ~*^font/                                1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── DNS dinámico del backend ────────────────────────────────────
    # nginx resuelve `proxy_pass http://nombre` UNA SOLA VEZ al arrancar.
    # Como el backend se recrea (cambia su IP 10.89.4.x) sin recrear el
    # front, eso dejaba 502 "no live upstreams / Host is unreachable".
    # Con variable + resolver, re-resuelve cada 10s vía el DNS de podman
    # (aardvark). 10.89.4.1 = gateway de la red `ferreteria_app-net`
    # (ver: podman network inspect ferreteria_app-net); solo cambia si
    # esa red se borra y recrea con otra subred.
    resolver 10.89.4.1 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream ferreteria-backend:8080;

    # Healthcheck rápido (sin pasar por el backend)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ─── API reverse proxy ─────────────────────────────────────────────
    # Todo lo que empieza con /api/ va al backend.
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        # Host/identidad
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Cookies HttpOnly del backend deben llegar al browser sin reescritura
        proxy_pass_header Set-Cookie;
        # Importante: nginx NO debe transformar cookies; las del backend ya
        # tienen Domain correcto (vacio) y Path=/.
        proxy_cookie_path / /;

        # WebSocket / SSE (futuro)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Timeouts: las requests de login pueden ser lentas en arranque
        # (JIT, hibernate, etc.). El doble del timeout de axios (30s).
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # ─── Prometheus scrape interno ───────────────────────────────────────
    # El job de Prometheus está dentro de la red Docker, así que puede
    # apuntar directo a ferreteria-backend:8080. Pero si lo quieres exponer
    # al host para debug manual, descomenta la regla location /metrics.
    # location = /actuator/prometheus { proxy_pass http://ferreteria-backend:8080/actuator/prometheus; }

    # ─── Assets con hash (vite emite /assets/<hash>.<ext>) ──────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Otros estáticos (favicon, etc.) ─────────────────────────────────
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Security headers — definidos a nivel server Y duplicados en
    # location / porque nginx no hereda add_header si el location define uno.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    # HSTS solo tiene efecto en HTTPS; en http://localhost se envía pero el
    # browser lo ignora (RFC 6797). Cuando TLS termine en LB/ingress, este
    # header llegará vía X-Forwarded-Proto:https.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── SPA fallback: cualquier ruta no matched → index.html ──────────
    # Necesario para React Router (BrowserRouter). El backend no recibe
    # ninguna ruta que no sea /api/* — el resto lo sirve nginx.
    location / {
        # No cachear index.html: queremos que los deploys se vean sin
        # que el browser sirva HTML viejo.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        # Duplicar security headers (nginx no hereda add_header si el location
        # define alguno — ver comentario en nivel server).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
