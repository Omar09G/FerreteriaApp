spring:
  application:
    name: ferreteria-backend
  autoconfigure:
    exclude:
      # Auth es 100% JWT contra seg.usuarios. Sin esta exclusión el auto-config de
      # Spring Security registra un usuario in-memory y loguea
      # "Using generated security password: ..." (warn de arranque).
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:6432}/${PG_DATABASE:ferreteria}
    username: ${PG_USER:ferreteria_app}
    password: ${PG_PASSWORD:ferreteriaApp}
    hikari:
      maximum-pool-size: 10      # <= default_pool_size de PgBouncer
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: ${ZONA:America/Mexico_City}  # alineado con el cluster PG
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    locations: classpath:db/migration   # generadas por :generateMigrations
    #Solo para DESA enabled: false
    enabled: false 

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

app:
  request-id:
    mode: ${REQUEST_ID_MODE:GENERATE}   # GENERATE | STRICT  (PLAN 4.5)
  jwt:
    secret: ${JWT_SECRET:sMuJeQ1prwGDL5SCu7tpS4FtCcIvbJ8Rw6cciudScgc=}
    access-minutes: ${ACCESS_MINUTES:480} #Son 8 horas, para que coincida con el refresh-hours
    refresh-hours: ${REFRESH_HOURS:72} #Son 3 días, para que coincida con el access-minutes
  zona: ${ZONA:America/Mexico_City}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${REQUEST_ID:-%X{requestId}}] %logger{36} - %msg%n"
  level:
    root: INFO


springdoc:
  swagger-ui:
    path: /swagger-ui.html
