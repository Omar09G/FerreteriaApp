# ============================================================================
# 45-backend.yaml — Service + Deployment del backend Spring Boot
# Objetivo del HPA 50-backend-hpa.yaml (kind Deployment, name ferreteria-backend)
# y del PDB ferreteria-backend-pdb (selector app: ferreteria-backend).
# Probes contra /actuator/health/* (probes enabled en application.yml).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: ferreteria-backend
  namespace: ferreteria
  labels:
    app: ferreteria-backend
spec:
  type: ClusterIP
  selector:
    app: ferreteria-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: ferreteria-backend-secret
  namespace: ferreteria
type: Opaque
# BACK-SEC-003: sin valores reales. Sustituir con SealedSecrets/ExternalSecrets/Vault
# antes del primer deploy. JWT_SECRET ≥32 bytes base64 (fail-fast en JwtService).
stringData:
  JWT_SECRET: "REPLACE_ME_VIA_EXTERNAL_SECRETS"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferreteria-backend
  namespace: ferreteria
  labels:
    app: ferreteria-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: ferreteria-backend
  template:
    metadata:
      labels:
        app: ferreteria-backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ferreteria/backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PG_HOST
              value: pgbouncer.ferreteria.svc.cluster.local
            - name: PG_PORT
              value: "6432"
            - name: PG_DATABASE
              value: ferreteria
            - name: PG_USER
              value: ferreteria_app
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: ferreteria-db-secret, key: POSTGRES_APP_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: ferreteria-backend-secret, key: JWT_SECRET }
            - name: SERVER_PORT
              value: "8080"
            - name: REQUEST_ID_MODE
              value: GENERATE
            # BACK-ESC-001: rate limit distribuido (capacidad global con HPA).
            # Redis efímero de 25-redis.yaml; sin URI el arranque aborta.
            - name: RATE_LIMIT_DISTRIBUTED
              value: "true"
            - name: RATE_LIMIT_REDIS_URI
              value: "redis://redis.ferreteria.svc.cluster.local:6379"
            # Operador: fijar orígenes reales del front (sin wildcard + credentials).
            - name: CORS_ALLOWED_ORIGINS
              value: "https://example.invalid"
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Duser.timezone=America/Mexico_City"
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 2000m, memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 10"] }
