# ============================================================================
# 10-postgres.yaml — StatefulSet + Services del primario
# Escalamiento VERTICAL: ajustar resources / storage en este archivo o por Terraform.
#
# NOTA DE ESCALAMIENTO HORIZONTAL: PostgreSQL es un único escritor. Para HA real
# con failover automático y réplicas gestionadas se recomienda el operador
# CloudNativePG (postgres.cnpg.io); este StatefulSet cubre el caso de un primario
# robusto con volumen persistente.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: ferreteria
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: ferreteria
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ferreteria
spec:
  serviceName: postgres-headless
  replicas: 1                       # single-writer; HA con CloudNativePG si se requiere
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: ferreteria
            - name: TZ
              value: America/Mexico_City
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: ferreteria-db-secret, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
              name: pg
          resources:                # ← ESCALAMIENTO VERTICAL (requests=garantía)
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2000m"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: conf
              mountPath: /etc/postgresql
          startupProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "ferreteria", "-q"] }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "ferreteria", "-q"] }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d ferreteria -q
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["pg_ctl", "stop", "-m", "fast", "-t", "50"] }
      volumes:
        - name: conf
          configMap:
            name: ferreteria-postgres-conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard     # ← cambiar según cluster (gp3, premium-rwo, longhorn...)
        resources:
          requests:
            storage: 20Gi
