# ============================================================================
# 40-migration-job.yaml — Job que ejecuta los scripts SQL de esquema
# (01 base, 02 tablas, vistas, 03 parametría, 04 admin) contra el primario.
# Lista explícita: 05_dummy/06/07 NUNCA entran a prod por construcción
# (demo solo vía backend con perfil `demo`; 06/07 los aplica Flyway V12/V13).
#
# PRERREQUISITO: crear el ConfigMap con los scripts del proyecto:
#   kubectl -n ferreteria create configmap ferreteria-sql \
#     --from-file=../../scripts/
#
# Ejecutar la migración:
#   kubectl -n ferreteria apply -f 40-migration-job.yaml
#   kubectl -n ferreteria logs job/ferreteria-db-init -f
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ferreteria-db-init
  namespace: ferreteria
  labels:
    app.kubernetes.io/part-of: ferreteria
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: db-init
    spec:
      restartPolicy: Never
      containers:
        - name: psql-runner
          image: postgres:17-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: ferreteria-db-secret, key: POSTGRES_PASSWORD }
          command: ["/bin/sh", "-ecx"]
          args:
            - |
              until pg_isready -h postgres-rw.ferreteria.svc.cluster.local -U postgres -q; do
                echo "Esperando a PostgreSQL..."; sleep 3;
              done
              cd /sql   # \ir de vistas_core.sql resuelve relativo al archivo incluido
              # Lista explícita anti-demo: aunque el ConfigMap traiga 05_dummy,
              # 06 o 07, el job solo aplica esquema productivo.
              for f in /sql/01_base_esquemas.sql /sql/02_tablas.sql /sql/vistas_core.sql /sql/03_parametria.sql /sql/04_admin.sql; do
                echo ">>> Ejecutando $$f";
                psql -h postgres-rw.ferreteria.svc.cluster.local \
                     -U postgres -d ferreteria \
                     -v ON_ERROR_STOP=1 -f "$$f" || exit 1;
              done
              echo "MIGRACIÓN COMPLETA"
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: ferreteria-sql
