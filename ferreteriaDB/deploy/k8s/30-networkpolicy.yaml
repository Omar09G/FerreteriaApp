# ============================================================================
# 30-networkpolicy.yaml — Zero-trust de red para la capa de datos
# Solo PgBouncer puede hablar con PostgreSQL; solo las apps del namespace
# pueden hablar con PgBouncer.
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-default-deny
  namespace: ferreteria
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: pgbouncer }
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-ingress
  namespace: ferreteria
spec:
  podSelector:
    matchLabels: { app: pgbouncer }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}          # cualquier pod del namespace ferreteria (backend)
      ports:
        - protocol: TCP
          port: 6432
