# TYPE  DATABASE   USER             ADDRESS         METHOD
# Local: peer para el superusuario del contenedor, password para el resto
# (antes trust: cualquier usuario del contenedor entraba sin password).
local   all        postgres                       peer
local   all        all                              scram-sha-256
# Aplicación (a través de PgBouncer o directo)
host    ferreteria ferreteria_app   0.0.0.0/0       scram-sha-256
host    ferreteria ferreteria_app   ::/0            scram-sha-256
# Réplica de lectura (streaming)
host    replication replicator      0.0.0.0/0       scram-sha-256
host    replication replicator      ::/0            scram-sha-256
# Administración local del contenedor (password de superusuario, nunca trust)
host    all        postgres         127.0.0.1/32    scram-sha-256
host    all        postgres         ::1/128         scram-sha-256
# Resto: denegado implícito
