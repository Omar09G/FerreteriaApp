# ============================================================================
# postgresql.conf — Tuning para concurrencia / eficiencia / velocidad
# Sistema Integral de Ferretería · OLTP punto de venta + analítica de dashboards
#
# Fórmulas de escalamiento VERTICAL (ajustar según RAM del host):
#   shared_buffers         ≈ 25% RAM
#   effective_cache_size   ≈ 60-75% RAM
#   work_mem               ≈ RAM / (max_connections * 4)  — con cuidado
#   maintenance_work_mem   ≈ 5-10% RAM
# ============================================================================

# ---------- Conexiones ----------
listen_addresses = '*'
port = 5432
max_connections = 300                 # el grueso del tráfico entra por PgBouncer (pooling)
superuser_reserved_connections = 5
password_encryption = scram-sha-256

# ---------- Memoria ----------
shared_buffers = 512MB                # 25% de 2GB (subir a 25% de la RAM real en prod)
effective_cache_size = 1536MB         # 75% de 2GB
work_mem = 16MB                       # sorts/hash por nodo de query
maintenance_work_mem = 256MB          # VACUUM / CREATE INDEX
autovacuum_work_mem = 128MB
temp_buffers = 8MB

# ---------- Parallelismo (velocidad en reportes/vistas) ----------
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
jit = off                             # OLTP corto: JIT penaliza latencia

# ---------- Planner ----------
random_page_cost = 1.1                # SSD/NVMe
effective_io_concurrency = 200
default_statistics_target = 150

# ---------- WAL y checkpoints (escritura rápida + durabilidad) ----------
wal_level = replica                   # habilita streaming replication
max_wal_senders = 5                   # réplicas de lectura
max_replication_slots = 5
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = on               # NO bajar sin evaluar pérdida ante crash
wal_compression = on

# ---------- Autovacuum (tablas calientes: ventas, detalles, movimientos) ----------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ---------- Observabilidad ----------
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_checkpoints = on
log_min_duration_statement = 500      # queries lentas >500ms al log
log_timezone = 'America/Mexico_City'

# ---------- Localización ----------
timezone = 'America/Mexico_City'      # REGLA GLOBAL: hora local México
datestyle = 'iso, mdy'

# ---------- Protecciones ----------
idle_in_transaction_session_timeout = 10min
deadlock_timeout = 1s
statement_timeout = 0                 # controlado por aplicación
