# ============================================================================
# Prometheus — Ferretería
# ----------------------------------------------------------------------------
# Scrape targets:
#   - otel-collector   :8889/metrics  (métricas agregadas de backend + browser)
#   - postgres-exporter :9187/metrics (métricas nativas de PostgreSQL)
#   - backend          :8080/actuator/prometheus (si se agregó micrometer-prometheus)
#   - prometheus       :9090/metrics  (self-monitoring)
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: docker-local
    env: docker

scrape_configs:
  # ─── OpenTelemetry Collector (métricas agregadas OTLP→Prometheus) ─────
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          component: collector

  # ─── PostgreSQL (postgres-exporter) ───────────────────────────────────
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          component: database
          db: ferreteria

  # ─── Backend Spring Boot (si tiene micrometer-prometheus) ─────────────
  - job_name: backend-spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']
        labels:
          component: backend
          language: java
          framework: spring-boot

  # ─── Self-monitoring ──────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

# Retention: 7 días (override con --storage.tsdb.retention.time en CLI si
# se necesita más). 7 días es suficiente para dev/staging; en prod usar
# Thanos/Cortex o un storage backend externo.
