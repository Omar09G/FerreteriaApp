# ============================================================================
# Grafana dashboards provider — carga automática al iniciar Grafana
# ============================================================================
apiVersion: 1

providers:
  - name: ferreteria
    orgId: 1
    folder: Ferretería
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
