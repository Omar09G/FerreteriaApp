# ============================================================================
# Grafana datasources — Prometheus (via OTel Collector) + Tempo (trazas)
# ============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.55.0

  # Backend de trazas. El datasource "tempo" (type tempo) habilita el explorador
  # de GraphQL de trazas (TraceQL) y el drill-down en el navegador de trazas.
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      tracesToMetrics: {}
      nodeGraph:
        enabled: true
