# pgBackRest — stanza ferreteria (DB-ESC-008, ver deploy/BACKUP.md).
# Montado ro en postgres-primary: ./conf/pgbackrest/pgbackrest.conf
# y repo en volumen dedicado pgbackrest_repo:/backups (separado de PGDATA).
[global]
repo1-path=/backups
repo1-retention-full=4
repo1-retention-diff=14
# Retención de WAL por tiempo (7 días). Requiere pgBackRest >= 2.45.
repo1-retention-archive-type=time
repo1-retention-archive=7

compress-type=lz4
checksum-page-error=y

log-level-console=info
log-level-file=detail

[ferreteria]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
# Sin pg1-host: repo y PG en el mismo host (compose local).
