# ============================================================================
# docker-compose.yml — Sistema Integral de Ferretería
# Compatible con: podman compose | podman-compose | docker compose
#
# ARRANQUE:
#   cp .env.example .env      # editar credenciales
#   podman compose up -d
#
# CON RÉPLICA DE LECTURA (perfil opcional):
#   podman compose --profile replica up -d
#
# BACKUP PITR (DB-ESC-008) — operativo, ver deploy/BACKUP.md:
#   - postgres-primary se construye de docker/postgres.Dockerfile
#     (postgres:17.11-alpine3.24 + pgbackrest) con archive_mode=on y repo en
#     el volumen pgbackrest_repo:/backups (separado de pg_data_primary).
#     Si tu .env fija PG_IMAGE a una imagen SIN pgbackrest, el archivado
#     falla visible en logs (usa la imagen del build o haz build).
#   - La stanza se crea sola en el primer init; si falla, manual:
#       podman compose exec postgres-primary pgbackrest --stanza=ferreteria stanza-create
#   - Backups programados = UNA línea de cron en el host (ver deploy/backup.sh):
#       0 2 * * 0 .../backup.sh full  |  0 2 * * 1-6 .../backup.sh diff
#       0 3 * * * .../backup.sh expire
#   - Restore = destructivo y manual (BACKUP.md §5).
#
# Arquitectura:
#   browser ──► frontend:80 (nginx, host 8080)
#                  │ /api/* reverse-proxy
#                  ▼
#              backend:8080 ──► pgbouncer:6432 ──► postgres-primary:5432
#                                                       │
#                                                       └─► [profile replica]
#                                                           postgres-replica:5433
# ============================================================================

name: ferreteria

services:

  # =================================================================
  # FRONTEND — Vite/React servido por nginx + reverse proxy a /api/
  # =================================================================
  frontend:
    build:
      context: ../../ferreteriaFront
      dockerfile: Dockerfile
      args:
        # Activar telemetría en la imagen de Docker (en .env local del repo
        # está false para no contaminar dev). El collector se asume accesible
        # en el host del browser vía localhost:4318 (puerto expuesto).
        VITE_OTEL_ENABLED: ${VITE_OTEL_ENABLED:-true}
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.0.0}
    image: ferreteria/frontend:latest
    container_name: ferreteria-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    # El frontend NO se comunica con la BD ni con PgBouncer; solo necesita
    # al backend en la red interna.
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  # =================================================================
  # BACKEND — Spring Boot 4.1 / Java 21
  # =================================================================
  backend:
    build:
      context: ../../ferreteriaBackend
      dockerfile: Dockerfile
      args:
        # Si querés que el agent no haga nada: OTEL_SDK_DISABLED=true.
        # Por defecto exporta trazas+metrics+logs al collector.
        OTEL_AGENT_VERSION: 2.34.0
    image: ferreteria/backend:latest
    container_name: ferreteria-backend
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      floci:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # BD vía PgBouncer
      PG_HOST: ${PG_HOST:-pgbouncer}
      PG_PORT: ${PG_PORT:-6432}
      PG_DATABASE: ${PG_DATABASE:-ferreteria}
      PG_USER: ${PG_USER:-ferreteria_app}
      PG_PASSWORD: ${PG_PASSWORD:?Define PG_PASSWORD en .env}
      # Zona horaria y puerto
      ZONA: ${ZONA:-America/Mexico_City}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # JWT
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (≥32 bytes base64)}
      ACCESS_MINUTES: ${ACCESS_MINUTES:-15}
      REFRESH_HOURS: ${REFRESH_HOURS:-8}
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-*}
      CORS_EXPOSED_HEADERS: ${CORS_EXPOSED_HEADERS:-X-Request-Id,X-RateLimit-Limit,X-RateLimit-Remaining,Retry-After}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-3600}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      # Cookies HttpOnly
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/}
      AUTH_COOKIE_REFRESH_NAME: ${AUTH_COOKIE_REFRESH_NAME:-rt}
      AUTH_COOKIE_ACCESS_NAME: ${AUTH_COOKIE_ACCESS_NAME:-at}
      # Rate limit
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_SCOPE_BY_USER: ${RATE_LIMIT_SCOPE_BY_USER:-true}
      RATE_LIMIT_CACHE_MAX_SIZE: ${RATE_LIMIT_CACHE_MAX_SIZE:-200000}
      RATE_LIMIT_CACHE_TTL_MINUTES: ${RATE_LIMIT_CACHE_TTL_MINUTES:-30}
      RATE_LIMIT_DEFAULT_CAPACITY: ${RATE_LIMIT_DEFAULT_CAPACITY:-300}
      RATE_LIMIT_DEFAULT_REFILL: ${RATE_LIMIT_DEFAULT_REFILL:-10}
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-10}
      RATE_LIMIT_AUTH_REFILL: ${RATE_LIMIT_AUTH_REFILL:-1}
      RATE_LIMIT_CATALOGO_CAPACITY: ${RATE_LIMIT_CATALOGO_CAPACITY:-1200}
      RATE_LIMIT_CATALOGO_REFILL: ${RATE_LIMIT_CATALOGO_REFILL:-40}
      # BACK-ESC-001: en compose default true (servicio redis abajo). bootRun
      # fuera de compose usa el default de application.yml (false, local).
      RATE_LIMIT_DISTRIBUTED: ${RATE_LIMIT_DISTRIBUTED:-true}
      RATE_LIMIT_REDIS_URI: ${RATE_LIMIT_REDIS_URI:-redis://redis:6379}
      # Request ID
      REQUEST_ID_MODE: ${REQUEST_ID_MODE:-GENERATE}
      # MinIO heredado: solo se usa con STORAGE_PROVEEDOR=minio y el perfil
      # minio-legacy. Floci es el proveedor normal.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-ferreteria-fotos}
      # Bucket PRIVADO separado para PDFs de ticket/nómina (nunca el de fotos).
      MINIO_DOCS_BUCKET: ${MINIO_DOCS_BUCKET:-ferreteria-tickets}
      # Proveedor de fotos/documentos: Floci local por defecto.
      STORAGE_PROVEEDOR: ${STORAGE_PROVEEDOR:-floci}
      FLOCI_ENDPOINT: ${FLOCI_ENDPOINT:-http://floci:4566}
      FLOCI_PUBLIC_URL: ${FLOCI_PUBLIC_URL:-http://localhost:4566}
      FLOCI_REGION: ${FLOCI_REGION:-us-east-1}
      FLOCI_ACCESS_KEY: ${FLOCI_ACCESS_KEY:-test}
      FLOCI_SECRET_KEY: ${FLOCI_SECRET_KEY:-test}
      FLOCI_BUCKET: ${FLOCI_BUCKET:-ferreteria-fotos}
      FLOCI_DOCS_BUCKET: ${FLOCI_DOCS_BUCKET:-ferreteria-tickets}
      # RabbitMQ (notificaciones async: ticket PDF / nómina pagada). En local
      # fuera de compose el backend usa localhost:5672 con APP_NOTIF_ENABLED=false
      # (no conecta al broker; los jobs quedan PENDIENTE hasta habilitar).
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-ferreteria}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      APP_NOTIF_ENABLED: ${APP_NOTIF_ENABLED:-true}
      NOTIF_MAX_INTENTOS: ${NOTIF_MAX_INTENTOS:-5}
      # Email transaccional: dev = Mailpit (este compose); prod = SMTP real.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Telegram: vacío = solo email + stub WhatsApp. Con token+chat el
      # consumer adjunta el PDF vía sendDocument.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # WhatsApp: mock en proceso (bandeja en memoria) por default; con
      # proveedor=evolution + base-url/instancia/api-key envía de verdad.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVEEDOR: ${WHATSAPP_PROVEEDOR:-mock}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL:-}
      WHATSAPP_INSTANCIA: ${WHATSAPP_INSTANCIA:-ferreteria}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_PREFIJO: ${WHATSAPP_PREFIJO:-521}
      # ─── OpenTelemetry (Java agent) ─────────────────────────────────
      OTEL_SERVICE_NAME: ferreteria-backend
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=docker,service.namespace=ferreteria"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.05}
      OTEL_METRIC_EXPORT_INTERVAL: 30000
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      # Tunnig JVM para contenedor
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Duser.timezone=${ZONA:-America/Mexico_City}"
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"   # swagger / health directo (opcional)
    networks:
      - app-net
      - db-net
      - obs-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 45s
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-2.0}

  # =================================================================
  # OpenTelemetry Collector — recibe OTLP del backend + browser
  # =================================================================
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f}
    container_name: ferreteria-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./conf/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"     # OTLP gRPC — backend
      - "${OTEL_HTTP_PORT:-4318}:4318"     # OTLP HTTP — browser (CORS)
      - "${OTEL_PROM_PORT:-8889}:8889"     # Prometheus metrics
    networks:
      - obs-net
      - app-net       # recibe del backend
    depends_on: []
    # NOTA: la imagen otel/opentelemetry-collector-contrib es distroless (solo
    # /otelcol-contrib + /etc, SIN shell ni wget/curl), por lo que NO se puede
    # definir un healthcheck HTTP interno. La disponibilidad del collector NO
    # debe bloquear la app: es un sidecar de observabilidad. Para liveness en
    # runtime se usa su telemetría interna (el receiver OTLP solo escucha si
    # el proceso está vivo) y Prometheus/Grafana reintentan el scrape.
    mem_limit: 512m
    cpus: 1.0

  # =================================================================
  # postgres-exporter — métricas nativas de PostgreSQL en Prometheus
  # =================================================================
  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.21.1@sha256:3b8e05a84282cd1199ad2fb6c66f362738bf4c68c1547d8f4226a34a7dd6d8d7}
    container_name: ferreteria-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    # Desactivar el collector built-in `stat_bgwriter`: su query usa esquema
    # pre-PG17 (checkpoints_timed en pg_stat_bgwriter) y falla en PostgreSQL 17.
    # Se sustituye por queries propias en queries.yaml (PG 17: las columnas de
    # checkpoint viven ahora en pg_stat_checkpointer). El --config.file no se
    # usa ("" = sin config principal), solo el archivo de queries extendidas.
    command:
      - "--no-collector.stat_bgwriter"
      - "--config.file="
      - "--extend.query-path=/config/queries.yaml"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD en .env}@postgres-primary:5432/ferreteria?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    volumes:
      - ./conf/postgres/queries.yaml:/config/queries.yaml:ro
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    networks:
      - obs-net
      - db-net
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    cpus: 0.5

  # =================================================================
  # Prometheus — scrapea OTel Collector + postgres-exporter + backend
  # =================================================================
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06}
    container_name: ferreteria-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./conf/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - obs-net
    depends_on:
      # Solo arrancar tras el collector (no esperar healthy: el collector no
      # publica healthcheck al ser distroless). Prometheus reintenta el scrape.
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0

  # =================================================================
  # Grafana — dashboards provisionados (Ferretería / Overview)
  # =================================================================
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101}
    container_name: ferreteria-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./conf/otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./conf/otel/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - obs-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5

  # =================================================================
  # Tempo — backend de trazas (OTLP gRPC/HTTP). Grafana lo consulta
  # via jaeger/explore. Persistencia en volumen para no perder spans.
  # =================================================================
  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38}
    container_name: ferreteria-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./conf/otel/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"    # Tempo query (Grafana datasource)
    networks:
      - obs-net
      - app-net
    # Tempo v2.6 tiene binario y /etc; healthcheck interno simple con
    # wget a /ready (imagen basada en clean y distroless-ish). Usamos --ready
    # que responde 200 cuando está listo para ingesta.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0

  # =================================================================
  # PostgreSQL PRIMARIO (escrituras)
  # =================================================================
  postgres-primary:
    # DB-ESC-008: imagen local con pgbackrest (sin ella archive_command no
    # existe). Rebuild de ~1 min la primera vez que se levante tras este cambio.
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: ${PG_IMAGE:-ferreteria/postgres:17.11-pgbackrest}
    container_name: ferreteria-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ferreteria
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD en .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD en .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Define REPLICATION_PASSWORD en .env}
      TZ: America/Mexico_City
      LANG: es_MX.utf8
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pg_data_primary:/var/lib/postgresql/data
      - ./conf/init/00_replica_user.sh:/docker-entrypoint-initdb.d/00_replica_user.sh:ro
      - ./conf/init/99_app_password.sh:/docker-entrypoint-initdb.d/99_app_password.sh:ro
      - ../scripts/01_base_esquemas.sql:/docker-entrypoint-initdb.d/10_01_base_esquemas.sql:ro
      - ../scripts/02_tablas.sql:/docker-entrypoint-initdb.d/11_02_tablas.sql:ro
      - ../scripts/vistas_core.sql:/docker-entrypoint-initdb.d/vistas_core.sql:ro
      - ../scripts/03_parametria.sql:/docker-entrypoint-initdb.d/12_03_parametria.sql:ro
      - ../scripts/04_admin.sql:/docker-entrypoint-initdb.d/13_04_admin.sql:ro
      # 05_dummy.sql NO se monta: los datos demo solo entran vía backend con
      # perfil `demo` (DemoDataRunner). Así initdb nunca deja credenciales demo
      # en un despliegue que parezca productivo.
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # DB-ESC-008: conf + repo de pgBackRest + auto-stanza en primer init.
      - ./conf/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./conf/init/14_pgbackrest_stanza.sh:/docker-entrypoint-initdb.d/14_pgbackrest_stanza.sh:ro
      - pgbackrest_repo:/backups
    ports:
      # Solo localhost: la app entra por PgBouncer (6432); 5432 directo es
      # solo para admin local. Sin bind exponía postgres a la LAN.
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    shm_size: ${PG_SHM_SIZE:-256mb}
    mem_limit: ${PG_MEM_LIMIT:-2g}
    cpus: ${PG_CPUS:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ferreteria -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - db-net

  # =================================================================
  # RÉPLICA DE LECTURA (perfil opcional)
  # =================================================================
  postgres-replica:
    # Réplica fija al upstream: no archiva (está en recovery) y no necesita
    # pgbackrest; así un PG_IMAGE custom del operador no la rompe.
    image: postgres:17.11-alpine3.24@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    container_name: ferreteria-postgres-replica
    restart: unless-stopped
    profiles: ["replica"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?}
      PRIMARY_HOST: ${PRIMARY_HOST:-postgres-primary}
      TZ: America/Mexico_City
    user: postgres
    entrypoint: ["/usr/local/bin/bootstrap-replica.sh"]
    volumes:
      - pg_data_replica:/var/lib/postgresql/data
      - ./conf/replica/bootstrap-replica.sh:/usr/local/bin/bootstrap-replica.sh:ro
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "${PG_REPLICA_HOST_PORT:-5433}:5432"
    shm_size: 256mb
    mem_limit: ${PG_MEM_LIMIT:-2g}
    cpus: ${PG_CPUS:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q && psql -U postgres -d ferreteria -tc 'SELECT pg_is_in_recovery();' | grep -q t"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - db-net

  # =================================================================
  # PgBOUNCER — pooling transaccional (la app SIEMPRE va aquí)
  # =================================================================
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-pgbouncer/pgbouncer:1.25.2@sha256:c0c55b277858ca308eb5df7baf8b83fbaea60b2c666604f29d8fe25e9decac68}
    container_name: ferreteria-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    # NOTA: el proveedor compose externo IGNORA `entrypoint: []`. Para saltar
    # el entrypoint del image (que exige DATABASES_HOST/DATABASES) y usar el
    # script propio, definimos entrypoint=/bin/sh -ecx y pasamos el script en
    # command. Así no corre /opt/pgbouncer/entrypoint.sh.
    entrypoint: ["/bin/sh", "-ecx"]
    environment:
      DB_HOST: postgres-primary
      DB_USER: ferreteria_app
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
    ports:
      - "${PGBOUNCER_HOST_PORT:-6432}:6432"
    command:
      - |
        mkdir -p /etc/pgbouncer
        {
          echo '[databases]'
          echo "ferreteria = host=$${DB_HOST} port=5432 dbname=ferreteria"
          echo ''
          echo '[pgbouncer]'
          echo 'listen_addr = 0.0.0.0'
          echo 'listen_port = 6432'
          echo 'auth_type = scram-sha-256'
          echo 'auth_file = /etc/pgbouncer/userlist.txt'
          echo 'pool_mode = transaction'
          echo 'max_client_conn = 1000'
          echo 'default_pool_size = 50'
          echo 'min_pool_size = 10'
          echo 'reserve_pool_size = 10'
          echo 'reserve_pool_timeout = 3'
          echo 'server_reset_query = DISCARD ALL'
          echo 'ignore_startup_parameters = extra_float_digits,options'
          echo 'admin_users = postgres'
        } > /etc/pgbouncer/pgbouncer.ini
        printf '"%s" "%s"\n"postgres" "%s"\n' \
          "$${DB_USER}" "$${DB_PASSWORD}" "$${ADMIN_PASSWORD}" > /etc/pgbouncer/userlist.txt
        exec /opt/pgbouncer/pgbouncer /etc/pgbouncer/pgbouncer.ini
    healthcheck:
      # La imagen pgbouncer/pgbouncer es Alpine sin psql. Usamos `nc -z`
      # (netcat de busybox) para verificar que el listener 6432 acepta
      # conexiones de cliente. La conectividad real de BD la confirma el
      # backend vía su propio healthcheck de Spring Data.
      test: ["CMD", "nc", "-z", "127.0.0.1", "6432"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - db-net

  # =================================================================
  # MinIO comunitario archivado — solo rollback/migración explícita.
  # No arranca en el perfil normal; el volumen minio_data se conserva.
  # =================================================================
  minio:
    profiles: ["minio-legacy"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: ferreteria-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env (mínimo 8 caracteres)}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - app-net

  # =================================================================
  # Floci — emulador S3 local para fotos y documentos; proveedor predeterminado.
  # La UI sidecar está desactivada para no montar el socket de Podman/Docker.
  # Persistencia: hybrid + volumen (la imagen trae memory por defecto
  # y todo se pierde al reiniciar). Ver conf de storage en docs Floci.
  # =================================================================
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:2.1.0@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db}
    container_name: ferreteria-floci
    restart: unless-stopped
    environment:
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-hybrid}
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"
      FLOCI_RUN_AS_ROOT: "false"
      FLOCI_SERVICES_UI_ENABLED: "false"
    ports:
      - "127.0.0.1:${FLOCI_HOST_PORT:-4566}:4566"
    volumes:
      - floci_data:/app/data
    networks:
      - app-net
    # La imagen oficial trae su propio HEALTHCHECK (GET /_floci/health).
    mem_limit: 512m
    cpus: 1.0

  # =================================================================
  # RabbitMQ — broker de notificaciones (ticket PDF / nómina pagada).
  # Exchange topic ferreteria.events + cola durable notificacion.jobs + DLQ.
  # Consola management: http://localhost:15672 (RABBITMQ_USER/PASSWORD).
  # =================================================================
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management@sha256:1c70aa901955dff9c3c86975cf77a9498a6e3448336a2e049dde888b44f9b977}
    container_name: ferreteria-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ferreteria}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0

  # =================================================================
  # Redis — backend del rate limit distribuido (BACK-ESC-001).
  # Sin persistencia ni puertos al host: los buckets se reconstruyen solos
  # (TTL = tiempo de recarga al máximo + 1 min) y solo el backend lo usa.
  # =================================================================
  redis:
    image: ${REDIS_IMAGE:-redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3}
    container_name: ferreteria-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 160m
    cpus: 0.5

  # =================================================================
  # Mailpit — SMTP de mentira para dev: atrapa los emails transaccionales
  # (tickets, recibos) sin enviar nada real. Bandeja web: http://localhost:8025.
  # El backend NO depende de él al arrancar (JavaMail conecta perezoso).
  # =================================================================
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e}
    container_name: ferreteria-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app-net
    mem_limit: 128m
    cpus: 0.5

networks:
  # Red para DB: postgres + pgbouncer + replica. Aislada.
  db-net:
    driver: bridge
  # Red de aplicación: front + back. Permite que nginx del front resuelva
  # ferreteria-backend por DNS.
  app-net:
    driver: bridge
  # Red de observabilidad: otel-collector, postgres-exporter, prometheus,
  # grafana. Aislada de app-net salvo por los servicios que necesitan
  # emitir (backend) o consultar (frontend OTLP).
  obs-net:
    driver: bridge

volumes:
  minio_data:
  floci_data:
  rabbitmq_data:
  pg_data_primary:
  pg_data_replica:
  # pgBackRest repo — PITR (DB-ESC-008). Separado de pg_data_primary a
  # propósito: si se pierde el disco de datos, los backups sobreviven.
  pgbackrest_repo: # -> /backups  repo1-path=/backups  stanza=ferreteria
  prometheus_data:
  grafana_data:
  tempo_data:
