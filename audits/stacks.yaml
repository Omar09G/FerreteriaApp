# stacks.yaml — Canonical stack table for the monorepo.
# Single source of truth for framework versions, referenced by the renderer.
# Update here, not in MEJORAS_ECC.md prose.
---
projects:
  - id: backend
    label: ferreteriaBackend
    runtime: Spring Boot 3.3.4
    language: Java 21 (toolchain)
    build: Gradle 8.10.2 (wrapper)
    persistence: JPA/Hibernate, Flyway, PostgreSQL JDBC
    security: Spring Security 6, JJWT 0.12.6
    observability: OpenTelemetry SDK 1.43.0, OTel Java agent 2.10.0, Micrometer/Prometheus
    test: JUnit 5, ArchUnit 1.3.0, Testcontainers, JaCoCo (gate >=80%)
    ancillary: Bucket4j 8.10.1, Caffeine, Lombok, springdoc-openapi 2.6.0

  - id: frontend
    label: ferreteriaFront
    runtime: React 19.2.8
    build: Vite 8.2.2 (rolldown + React Compiler via @rolldown/plugin-babel)
    language: TypeScript 6.0.2
    ui: Tailwind 4.3.3
    state: Zustand 5.0.15, TanStack Query 5.102.8
    routing: React Router 7.18.2
    charts: Recharts 3.10.1
    dialogs: SweetAlert2 11.14.5
    icons: lucide-react 1.34.0
    http: axios 1.20.x
    telemetry: '@opentelemetry/* (browser SDK)'
    i18n: es-MX, en
    test: NONE (no test runner installed)
    lint: ESLint 10.9.0
    pkg_manager: bun (bun.lock present)

  - id: database
    label: ferreteriaDB
    runtime: PostgreSQL 14+ (target) / 17 (compose)
    schema_count: 9 (cat, cfg, rh, seg, inv, com, ven, fin, fis)
    migrations: Flyway (V1__base, V2__parametria, plus deltas)
    pool: PgBouncer (transaction mode)
    observability: postgres-exporter, OpenTelemetry Collector, Prometheus, Grafana, Tempo
    deploy_targets: [Podman Compose, Kubernetes, Terraform]