version: 2
updates:
  - package-ecosystem: gradle
    directory: /ferreteriaBackend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /ferreteriaFront
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    groups:
      bun-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /ferreteriaBackend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City

  - package-ecosystem: docker
    directory: /ferreteriaFront
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City

  - package-ecosystem: docker-compose
    directory: /ferreteriaDB/deploy
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City

  - package-ecosystem: docker
    directory: /ferreteriaDB/deploy/docker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City

  - package-ecosystem: terraform
    directory: /ferreteriaDB/deploy/terraform
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City