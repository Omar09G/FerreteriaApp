name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferreteriaBackend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build + tests + JaCoCo gates
        run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferreteriaFront
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ferreteriaFront/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # bun run test = vitest run (bun test a secas usa el runner propio
      # de Bun y no resuelve el alias @/ de Vite).
      - run: bun run test
      - run: bun run build
      - run: bun run check:bundle

  # SonarQube / Fortify: conectar cuando haya servidor y tokens.
