name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate audit
        run: python3 scripts/validate.py audits/findings.yaml
      - name: Render audit
        run: python3 scripts/render.py && git diff --exit-code docs/MEJORAS_ECC.md || (echo "::error::docs/MEJORAS_ECC.md desactualizado - ejecuta python3 scripts/render.py" && exit 1)
      - name: Backend tests
        working-directory: ferreteriaBackend
        run: ./gradlew test --info
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: ferreteriaBackend/build/reports/tests/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ferreteriaFront/package-lock.json
      - name: Install
        working-directory: ferreteriaFront
        run: npm ci
      - name: Typecheck
        working-directory: ferreteriaFront
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Vitest
        working-directory: ferreteriaFront
        run: npx vitest run --reporter=verbose
      - name: Lint
        working-directory: ferreteriaFront
        run: npx eslint src/ --max-warnings 10

  audit-gate:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Check 100% audit
        run: |
          done=$(grep -c "status: done" audits/findings.yaml)
          total=$(grep -c "^- id:" audits/findings.yaml)
          echo "Audit: $done/$total done"
          if [ "$done" -ne "$total" ]; then echo "::warning::Audit incompleto: $done/$total"; fi
